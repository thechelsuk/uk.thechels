---
name: x - Link Checker

# Weekly, on Monday mornings, and by hand, through the shared link checker.
# Internal links and fragments only: the site links out too often to check
# every external link each week. Broken links go in one open "broken-links"
# issue assigned to thechelsuk, closed once a run finds none.

on:
    workflow_dispatch:
    schedule:
        - cron: "0 6 * * 1"

permissions:
    contents: read
    issues: write

jobs:
    links:
        uses: thechelsuk/workflows/.github/workflows/link-checker.yml@main
        with:
            site_host: thechels\.uk
            ruby_version: ".ruby-version"
            internal_only: true
            post_build: bash .github/scripts/copy-markdown-sources.sh
            # The homepage's year anchors (/#2026 to /#1999) exist, but lychee
            # looks for an anchor on the root folder, not its index.html.
            extra_args: --exclude '_site/?#[0-9]{4}$'
