---
name: Reusable Lighthouse

on:
    workflow_call:
        inputs:
            urls:
                description: >-
                    Comma-separated URLs for local Lighthouse checks. The
                    action splits on commas only, and the local static
                    server does not map extensionless paths, so use .html.
                    Port 4000 is reserved: the action runs Chrome's
                    debugging port on 4000.
                required: false
                default: >-
                    http://127.0.0.1:8080/,http://127.0.0.1:8080/projects.html,http://127.0.0.1:8080/about.html,http://127.0.0.1:8080/slashes.html,http://127.0.0.1:8080/disability.html
                type: string

jobs:
    lighthouse:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: ruby/setup-ruby@v1
              with:
                  ruby-version: ".ruby-version"
                  bundler-cache: true

            - name: Build Jekyll site for local checks
              run: |
                  printf 'webmentions:\n  pause_lookups: true\n' > /tmp/lighthouse_config.yml
                  bundle exec jekyll build --trace --config _config.yml,/tmp/lighthouse_config.yml

            - name: Start local static server
              run: |
                  python -m http.server 8080 --directory _site > /tmp/http-server.log 2>&1 &
                  for i in $(seq 1 30); do
                    curl -sf http://127.0.0.1:8080/ > /dev/null && exit 0
                    sleep 1
                  done
                  echo "Local server did not start" >&2
                  exit 1

            - name: Lighthouse
              uses: foo-software/lighthouse-check-action@master
              id: lighthouseCheck
              with:
                  urls: ${{ inputs.urls }}
                  gitAuthor: "${{ github.actor }}"
                  gitBranch: "${{ github.ref }}"
                  gitHubAccessToken: "${{ secrets.GITHUB_TOKEN }}"
                  device: all

            - name: Verify Lighthouse Check results
              uses: foo-software/lighthouse-check-status-action@master
              with:
                  minAccessibilityScore: "${{ vars.LIGHTHOUSE_SCORE_MIN || '95' }}"
                  minBestPracticesScore: "${{ vars.LIGHTHOUSE_SCORE_MIN || '95' }}"
                  minPerformanceScore: "${{ vars.LIGHTHOUSE_SCORE_MIN || '95' }}"
                  minProgressiveWebAppScore: "${{ vars.LIGHTHOUSE_SCORE_MIN || '95' }}"
                  minSeoScore: "${{ vars.LIGHTHOUSE_SCORE_MIN || '95' }}"
                  lighthouseCheckResults: ${{ steps.lighthouseCheck.outputs.lighthouseCheckResults }}
