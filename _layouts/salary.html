{% include header.html %}
<h1 class="post-title">{{ page.title }}</h1>
{% include page_meta.html count=site.data.salaries.size noun="entries" %}

{{content}}

{% assign items = site.data.salaries %}


<ul id="salaries">
    {% for item in items %}
    <li>{{item.date}}: £{{item.value | number_to_currency}}</li>
    {% endfor %}
</ul>
{% include footer.html %}
