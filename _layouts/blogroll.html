{% include header.html %}
<h1 class="post-title">{{ page.title }}</h1>
{% include page_meta.html count=site.data.blogroll.size noun="blog subscriptions" %}

{{ content }}

{% assign sorted = site.data.blogroll | sort: 'title' %}
<ul class="data-list">
    {% for item in sorted %}
    <li><a class="ext" href="{{item.htmlUrl}}">{{item.title}}</a><a class="meta" href="{{ item.xmlUrl}}">feed</a></li>
    {% endfor %}
</ul>
{% include footer.html %}
