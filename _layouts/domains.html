{% include header.html %}
<h1 class="post-title">{{ page.title }}</h1>
{% include page_meta.html count=site.data.domains.size noun="domains" %}

{{ content }}

{% assign sorted = site.data.domains | sort: 'domain' %}
<ul class="data-list">
    {% for item in sorted %}
    <li><a class="ext" href="https://{{ item.domain }}">{{ item.domain }}</a></li>
    {% endfor %}
</ul>
{% include footer.html %}
